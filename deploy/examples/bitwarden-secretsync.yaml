# Example Deployment with Bitwarden/Vaultwarden secret sync.
#
# Prerequisites:
# 1. JASM controller deployed with Bitwarden credentials
# 2. ENABLE_BITWARDEN=true on the controller
# 3. Bitwarden vault item exists at the specified path
#
# This example syncs a secret from a Bitwarden vault to a Kubernetes secret
# using the jasm.io/secret-sync pod annotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden-example
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitwarden-example
  template:
    metadata:
      labels:
        app: bitwarden-example
      annotations:
        # Secret sync annotation
        # Format: bw://<folder>/<item>[/<field>]
        jasm.io/secret-sync: |
          provider: bitwarden
          path: bw://my-folder/my-item
          secretName: my-app-secret
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
