# Example Deployment with AWS Secrets Manager secret sync.
#
# Prerequisites:
# 1. JASM controller deployed with AWS credentials (IRSA, instance role, or static credentials)
# 2. AWS secret exists at the specified path (secret name or ARN)
# 3. Secret value must be a JSON object with string key-value pairs
#
# This example syncs a secret from AWS Secrets Manager to a Kubernetes secret
# using the jasm.io/secret-sync pod annotation.
#
# AWS Authentication Options:
# - IRSA (recommended for EKS): Annotate the service account
# - Instance IAM role (recommended for self-hosted): Automatic
# - Static credentials (dev only): Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-example
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aws-example
  template:
    metadata:
      labels:
        app: aws-example
      annotations:
        # Secret sync annotation
        # Path format: <secret-name> or <secret-arn>
        jasm.io/secret-sync: |
          provider: aws-secretsmanager
          path: my-app/database-credentials
          secretName: my-app-db-secret
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
---
# Example using ARN path
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-example-arn
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aws-example-arn
  template:
    metadata:
      labels:
        app: aws-example-arn
      annotations:
        # Using full ARN path
        jasm.io/secret-sync: |
          provider: aws-secretsmanager
          path: arn:aws:secretsmanager:us-east-1:123456789012:secret:my-app/api-keys-abc123
          secretName: my-app-api-secret
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
