# Example Deployment with 1Password secret sync.
#
# Prerequisites:
# 1. JASM controller deployed with OP_SERVICE_ACCOUNT_TOKEN environment variable
# 2. 1Password vault item exists at the specified path
# 3. Service account has access to the vault
#
# This example syncs a secret from 1Password to a Kubernetes secret
# using the jasm.io/secret-sync pod annotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepassword-example
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onepassword-example
  template:
    metadata:
      labels:
        app: onepassword-example
      annotations:
        # Secret sync annotation
        # Format: op://<vault>/<item>[/<field>]
        # Fetches all fields when field is omitted
        jasm.io/secret-sync: |
          provider: 1password
          path: op://my-vault/database-credentials
          secretName: my-app-db-secret
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
---
# Example fetching a specific field
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepassword-example-field
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onepassword-example-field
  template:
    metadata:
      labels:
        app: onepassword-example-field
      annotations:
        # Fetch only the password field
        jasm.io/secret-sync: |
          provider: 1password
          path: op://my-vault/database-credentials/password
          secretName: my-app-db-password
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
---
# Example with section/field path
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepassword-example-section
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onepassword-example-section
  template:
    metadata:
      labels:
        app: onepassword-example-section
      annotations:
        # Fetch field from a specific section
        # Format: op://<vault>/<item>/<section>/<field>
        jasm.io/secret-sync: |
          provider: 1password
          path: op://my-vault/api-credentials/production/api-key
          secretName: my-app-api-key
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
